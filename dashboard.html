<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard — CityBin</title>

  <link rel="icon" type="image/jpeg" href="Assets/img/Logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body class="cb-login-page">
  <nav class="navbar navbar-expand-lg cb-navbar cb-auth-nav">
    <div class="container">
      <a class="cb-brand" href="index.html">
        <img src="Assets/img/Logo.jpg" alt="" class="cb-logo-img">
        CityBin
      </a>
      <a class="cb-login" href="index.html">Beranda</a>
    </div>
  </nav>

  <main class="cb-main cb-auth-main">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <section class="cb-form-wrap" aria-labelledby="dashTitle">
            <div class="cb-eyebrow">Akun Anda</div>
            <h1 id="dashTitle">Dashboard</h1>
            <p class="cb-sub">Selamat datang kembali di CityBin.</p>

            <div class="mb-3">
              <div class="form-label">Nama</div>
              <p class="mb-0 fw-semibold" id="userName">Memuat...</p>
            </div>
            <div class="mb-3">
              <div class="form-label">Email</div>
              <p class="mb-0" id="userEmail">Memuat...</p>
            </div>
            <div class="mb-3">
              <div class="form-label">Bergabung sejak</div>
              <p class="mb-0" id="userCreatedAt">Memuat...</p>
            </div>

            <div id="dashboardAlert" class="alert d-none" role="alert" aria-live="polite"></div>
            <button type="button" id="logoutBtn" class="btn btn-cb">Logout</button>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="JavaScript/dashboard.js"></script>
</body>
</html>
