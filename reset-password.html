<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — CityBin</title>

  <link rel="icon" type="image/jpeg" href="Assets/img/Logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>
<body class="cb-login-page">
  <nav class="navbar navbar-expand-lg cb-navbar cb-auth-nav">
    <div class="container">
      <a class="cb-brand" href="index.html">
        <img src="Assets/img/Logo.jpg" alt="" class="cb-logo-img">
        CityBin
      </a>
      <a class="cb-login" href="login.html">Login</a>
    </div>
  </nav>

  <main class="cb-main cb-auth-main">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <section class="cb-form-wrap" aria-labelledby="resetTitle">
            <div class="cb-eyebrow">Account recovery</div>
            <h1 id="resetTitle">Atur password baru</h1>
            <p class="cb-sub">Gunakan minimal 8 karakter dengan kombinasi huruf dan angka.</p>

            <form id="resetForm" novalidate>
              <div class="mb-3">
                <label for="resetPassword" class="form-label">Password baru</label>
                <input type="password" id="resetPassword" name="password" class="form-control"
                       placeholder="Minimal 8 karakter" minlength="8" maxlength="128"
                       autocomplete="new-password" required>
              </div>
              <div class="mb-3">
                <label for="resetConfirm" class="form-label">Konfirmasi password baru</label>
                <input type="password" id="resetConfirm" name="confirmPassword" class="form-control"
                       placeholder="Ulangi password baru" minlength="8" maxlength="128"
                       autocomplete="new-password" required>
              </div>

              <div id="resetAlert" class="alert d-none" role="alert" aria-live="polite"></div>
              <button type="submit" class="btn btn-cb">Simpan password</button>
            </form>

            <p class="cb-signup">Sudah punya password baru? <a href="login.html">Login</a></p>
            <a href="index.html" class="cb-back">Kembali ke beranda</a>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="JavaScript/reset-password.js"></script>
</body>
</html>
